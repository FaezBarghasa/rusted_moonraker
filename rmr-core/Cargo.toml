[package]
name = "rmr-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
surrealdb = { version = "2.6.5", features = ["kv-surrealkv", "kv-mem"] }
rust-ini = "0.21.3"
thiserror = "1.0"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
actix-web = "4"
actix-ws = "0.3"
ipnetwork = "0.20.0"
memmap2 = "0.9"
regex = "1.12"
futures-util = "0.3"
base64 = "0.22"
walkdir = "2.5"
