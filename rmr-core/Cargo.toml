[package]
name = "rmr-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
surrealdb = { version = "3.1.2", features = ["kv-rocksdb", "kv-surrealkv", "kv-mem"] }
rust-ini = "0.21.3"
thiserror = "2.0.18"
dirs = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
actix-web = "4"
actix-ws = "0.4.0"
actix = "0.13"
actix-web-actors = "4.3"
ipnetwork = "0.20.0"
memmap2 = "0.9"
regex = "1.12"
futures-util = "0.3"
base64 = "0.22"
walkdir = "2.5"
rayon = "1.10"
actix-multipart = "0.7.2"
futures = "0.3.32"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "gcode_benchmark"
harness = false

