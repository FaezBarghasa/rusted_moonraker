[package]
name = "rmr-core"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-multipart = "0.6"
actix-ws = "0.2"
actix-files = "0.6"
brotli = "3.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
surrealdb = { version = "1.0", features = ["kv-rocksdb"] }
futures = "0.3"
futures-util = "0.3"
log = "0.4"
env_logger = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
criterion = "0.5"